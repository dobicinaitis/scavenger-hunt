<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <style th:fragment="ghosts-css" rel="stylesheet">
        #ghost-container {
            position: absolute;
            z-index: -1;
            width: 100%;
            height: 100%;
            top: 0;
            overflow: hidden;
        }

        .ghost {
            position: absolute;
            width: 60px;
            height: 60px;
            opacity: 0;
            pointer-events: none;
            animation: float 6s linear forwards;
            background-repeat: no-repeat;
            background-size: contain;
            background-position: center;
            background-image: url('data:image/svg+xml, <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path opacity="0.5" d="M22 19.2058V12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12V19.2058C2 20.4896 3.35098 21.3245 4.4992 20.7504C5.42726 20.2864 6.5328 20.3552 7.39614 20.9308C8.36736 21.5782 9.63264 21.5782 10.6039 20.9308L10.9565 20.6957C11.5884 20.2744 12.4116 20.2744 13.0435 20.6957L13.3961 20.9308C14.3674 21.5782 15.6326 21.5782 16.6039 20.9308C17.4672 20.3552 18.5727 20.2864 19.5008 20.7504C20.649 21.3245 22 20.4896 22 19.2058Z" fill="white"/><path d="M15 12C15.5523 12 16 11.3284 16 10.5C16 9.67157 15.5523 9 15 9C14.4477 9 14 9.67157 14 10.5C14 11.3284 14.4477 12 15 12Z" fill="black"/><path d="M10 10.5C10 11.3284 9.55228 12 9 12C8.44772 12 8 11.3284 8 10.5C8 9.67157 8.44772 9 9 9C9.55228 9 10 9.67157 10 10.5Z" fill="black"/></svg>');
        }

        @keyframes float {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.8);
            }
            20% {
                opacity: 0.3;
            }
            80% {
                opacity: 0.3;
            }
            100% {
                opacity: 0;
                transform: translateY(-150px) scale(1.1);
            }
        }
    </style>
</head>
<body>
<div th:fragment="ghosts-content" id="ghost-container">
</div>
</body>
<script th:fragment="ghosts-js" type="text/javascript">

    const container = document.getElementById("ghost-container");
    const ghosts = []; // track existing ghost positions

    function spawnGhost() {
        const ghost = document.createElement("div");
        ghost.classList.add("ghost");

        // Random size
        const size = 40 + Math.random() * 40;
        ghost.style.width = `${size}px`;
        ghost.style.height = `${size}px`;

        let x, y;
        let tries = 0;
        const maxTries = 20;

        do {
            x = Math.random() * (container.clientWidth - size);
            y = Math.random() * (container.clientHeight - size);
            tries++;
        } while (ghosts.some(g => isOverlap(x, y, size, g.x, g.y, g.size)) && tries < maxTries);

        ghost.style.left = `${x}px`;
        ghost.style.top = `${y}px`;

        container.appendChild(ghost);

        // Add to tracking array
        ghosts.push({ x, y, size });

        // Remove ghost after animation
        setTimeout(() => {
            ghost.remove();
            const index = ghosts.findIndex(g => g.x === x && g.y === y);
            if (index > -1) ghosts.splice(index, 1);
        }, 6000);
    }

    // Collision detection
    function isOverlap(x1, y1, size1, x2, y2, size2) {
        return !(x1 + size1 < x2 || x1 > x2 + size2 || y1 + size1 < y2 || y1 > y2 + size2);
    }

    // Spawn ghosts periodically
    setInterval(spawnGhost, 2000);
</script>
</html>
