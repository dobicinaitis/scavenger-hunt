workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - when: never

stages:
  - package
  - release
  - deploy

include:
  - component: $CI_SERVER_FQDN/dobicinaitis/pipeline-components/kubernetes-release@main
    rules:
      - if: $CI_COMMIT_TAG

"Deploy":
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  image: registry.gitlab.com/dobicinaitis/helm-tools:latest
  variables:
    # app
    VERSION: $CI_COMMIT_TAG
    # chart
    # APP_HOST: <VALUE-FROM-CI-VARIABLE>
    NAMESNAPCE: $CI_PROJECT_NAME
    DEPLOYMENT_NAME: $CI_PROJECT_NAME
    REGISTRY_URL: $CI_REGISTRY_IMAGE
    REGISTRY_USER: $CI_DEPLOY_USER
    REGISTRY_PASSWORD: $CI_DEPLOY_PASSWORD
    # k8s
    KUBE_CONTEXT: "dobicinaitis/skypiea-gitlab-agent:gitlab-agent"
  before_script:
    - |
      STRIPPED_VERSION=$(echo "$VERSION" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/')
      if [[ "$VERSION" != "$STRIPPED_VERSION" ]]; then
          echo "Stripped 'v' prefix from version '$VERSION'. New value '$STRIPPED_VERSION'."
          VERSION=$STRIPPED_VERSION
      fi
    - helm registry login -u $REGISTRY_USER -p "$REGISTRY_PASSWORD" $REGISTRY_URL
  script:
    - echo "🚀 Deploying application version $VERSION to Kubernetes ..."
    - |
      # create or update the quest configuration ConfigMap
      echo $QUEST_CONFIG_BASE64 | base64 -d > quest.yml
      kubectl -n $NAMESPACE create configmap quest-config --from-file=quest.yml \
          --dry-run=client -o yaml | kubectl apply -f -
    - |
      helm upgrade --install $DEPLOYMENT_NAME \
          --namespace $NAMESNAPCE \
          --create-namespace \
          --set ingress.enabled=true \
          --set ingress.className=nginx \
          --set ingress.hosts[0].host=$APP_HOST \
          --set ingress.hosts[0].paths[0].path=/ \
          --set ingress.hosts[0].paths[0].pathType=Prefix \
          --set ingress.tls[0].hosts[0]=$APP_HOST \
          --set ingress.tls[0].secretName=$DEPLOYMENT_NAME-tls \
          --set imagePullSecrets[0].name=gitlab-registry-secret \
          --set imagePullSecrets[0].registry=$REGISTRY_URL \
          --set imagePullSecrets[0].username=$REGISTRY_USER \
          --set imagePullSecrets[0].password="$REGISTRY_PASSWORD" \
          --set imagePullSecrets[0].email="dummy-email@example.com" \
          --set volumes[0].name=quest-config \
          --set volumes[0].configMap.name=quest-config \
          --set volumeMounts[0].name=quest-config \
          --set volumeMounts[0].mountPath=app/config/ \
          --set certificate.enabled=true \
          --set certificate.dnsNames[0]=$APP_HOST \
          --atomic \
          --hide-notes \
          --kube-context $KUBE_CONTEXT \
          --kubeconfig $KUBECONFIG \
          oci://$CI_REGISTRY_IMAGE/charts/$CI_PROJECT_NAME --version $VERSION